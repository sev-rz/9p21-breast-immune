# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "9p21-breast-immune"
description = "Does loss of 9p21.3 make breast tumours immune cold? TCGA PanCanAtlas analysis"
authors = ["Sevinch Rakhmon-Zoda", "Jenna Khanfar"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
pandas = ">=2"
numpy = ">=2"
scipy = ">=1.13"
statsmodels = ">=0.14"
scikit-learn = ">=1.5"
matplotlib = ">=3.9"
snakemake = ">=9.27.1,<10"
snakefmt = ">=2.1.0,<3"
graphviz = ">=14.1.2,<15"

[tasks]
check = { cmd = "python --version && snakemake --version", description = "Check that the tools work" }
download = { cmd = "snakemake --cores 1 download_gdc download_cbioportal", description = "Download the raw data and verify checksums" }
run-snakemake = { cmd = "snakemake --cores 4", description = "Run the whole pipeline with Snakemake" }
dag = { cmd = "mkdir -p results && snakemake --dag | dot -Tpdf > results/dag.pdf", description = "Draw the workflow graph (results/dag.pdf)" }
lint = { cmd = "snakefmt --check workflow/Snakefile", description = "Check Snakefile formatting" }
# `reproduce` rebuilds every result from the raw data with one command.
reproduce = [{ task = "run-snakemake" }]
